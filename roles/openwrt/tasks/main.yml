---
# Entry point of the openwrt role. The phases run in this order:
#
#   1. validate   check rollback settings and paths before touching the router
#   2. build      turn variables into openwrt_uci_sections (build.yml)
#   3. validate   check the section paths and list values (validate_sections.yml)
#   4. manifest   read the ownership manifest written by the last successful run
#   5. plan       work out which sections and options this role must prune
#   6. stage      write every desired edit to the uncommitted UCI delta (stage.yml)
#   7. approve    show `uci changes`; discard everything unless the operator types yes
#   8. rollback   for network/firewall changes, arm an on-device timer (rollback_prepare.yml)
#   9. commit     uci commit each changed package; reload services (handlers/main.yml)
#  10. confirm    ask the operator to confirm reachability; cancel the timer (rollback_confirm.yml)
#  11. record     write the new manifest so the next run knows what this role owns
#
# Ansible runs this file with the router inventory host as `inventory_hostname`.
# Every task uses `raw` (plain shell over SSH) except the template and file
# tasks, which need Python on the router (installed by site.yml).

# ---- 1-3. Validate and build -------------------------------------------------

- name: Validate rollback controls
  ansible.builtin.include_tasks: validate.yml

- name: Build UCI sections from the role variables
  ansible.builtin.include_tasks: build.yml

- name: Validate the desired UCI identities
  ansible.builtin.include_tasks: validate_sections.yml

# ---- 4. Read the previous ownership manifest --------------------------------
# The manifest lists what the last successful run wrote: S:<section> for each
# section and O:<section>.<option> for each option. It is the only thing that
# lets a run prune config that was removed from the variables.

- name: Read the previous managed-section manifest
  ansible.builtin.raw: |
    if [ -e {{ openwrt_uci_manifest_path | quote }} ]; then
      [ -r {{ openwrt_uci_manifest_path | quote }} ] || exit 1
      cat {{ openwrt_uci_manifest_path | quote }}
    fi
  register: openwrt_uci_old_manifest
  changed_when: false

- name: Record manifest lines and desired paths
  ansible.builtin.set_fact:
    openwrt_uci_manifest_lines: "{{ openwrt_uci_old_manifest.stdout.splitlines() }}"
    openwrt_uci_desired_paths: "{{ openwrt_uci_sections | map(attribute='path') | list }}"
    openwrt_uci_desired_option_paths: []
    openwrt_uci_desired_section_records: >-
      {{ openwrt_uci_sections | map(attribute='path') | map('regex_replace', '^', 'S:') | list }}
    openwrt_uci_desired_option_records: []

- name: Parse the previous ownership manifest
  ansible.builtin.set_fact:
    openwrt_uci_previous_sections: >-
      {{ openwrt_uci_manifest_lines | select('match', '^S:')
         | map('regex_replace', '^S:', '') | list }}
    openwrt_uci_previous_options: >-
      {{ openwrt_uci_manifest_lines | select('match', '^O:')
         | map('regex_replace', '^O:', '') | list }}

# Every option and list key of every desired section becomes an O: record.
- name: Build desired option ownership records
  ansible.builtin.set_fact:
    openwrt_uci_desired_option_paths: >-
      {{ openwrt_uci_desired_option_paths
         + (((item.options | default({}) | dict2items)
             + (item.lists | default({}) | dict2items))
            | map(attribute='key')
            | map('regex_replace', '^', item.path ~ '.') | list) }}
    openwrt_uci_desired_option_records: >-
      {{ openwrt_uci_desired_option_records
         + (((item.options | default({}) | dict2items)
             + (item.lists | default({}) | dict2items))
            | map(attribute='key')
            | map('regex_replace', '^', 'O:' ~ item.path ~ '.') | list) }}
  loop: "{{ openwrt_uci_sections }}"
  loop_control:
    label: "{{ item.path }}"

# Pruning deletes config. A manifest that does not parse could make the role
# delete the wrong things, so an invalid or duplicated manifest stops the run.
- name: Refuse to prune from an invalid managed manifest
  ansible.builtin.assert:
    that:
      - >-
        openwrt_uci_manifest_lines
        | select('match', '^(S:[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+|O:[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+)$')
        | list | length == openwrt_uci_manifest_lines | length
      - openwrt_uci_manifest_lines | unique | list | length == openwrt_uci_manifest_lines | length
    fail_msg: "Managed UCI manifest is invalid; refusing to remove any configuration."
    quiet: true

# ---- 5. Plan -----------------------------------------------------------------

# Packages this run can change: those of the desired sections and options, and
# those that held records in the previous manifest (which may need pruning).
- name: Determine packages touched by desired state or prior ownership
  ansible.builtin.set_fact:
    openwrt_uci_packages: >-
      {{ (openwrt_uci_desired_paths + openwrt_uci_desired_option_paths
          + (openwrt_uci_previous_sections | difference(openwrt_uci_desired_paths))
          + (openwrt_uci_previous_options | difference(openwrt_uci_desired_option_paths)))
          | map('regex_replace', '[.].*$', '') | unique | list }}

# If a package already has uncommitted edits (for example from a manual `uci set`),
# this run would mix them into its own diff, so the run stops before staging.
- name: Refuse to mix this run with pre-existing staged UCI edits
  ansible.builtin.raw: >-
    changes=$(uci -q changes {{ item | quote }}) || exit 1;
    [ -z "$changes" ] || {
      echo "Package {{ item }} has staged UCI changes; review or revert them first." >&2;
      exit 1;
    }
  loop: "{{ openwrt_uci_packages }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

# ---- 6-7. Stage, show the diff, and get approval -----------------------------
# If staging or approval fails, the rescue block reverts every staged package
# and stops the run. The router keeps its committed configuration.

- name: Stage desired UCI state, show diff, and obtain approval
  block:
    - name: Stage and review desired UCI changes
      ansible.builtin.include_tasks: stage.yml
  rescue:
    - name: Revert staged UCI edits if review or staging fails
      ansible.builtin.raw: "uci revert {{ item | quote }}"
      loop: "{{ openwrt_uci_packages }}"
      when: openwrt_uci_staging_started | default(false)
      loop_control:
        label: "{{ item }}"
      changed_when: false

    - name: Stop after reverting staged UCI edits
      ansible.builtin.fail:
        msg: "Staging or approval failed; staged UCI edits were reverted."

# ---- 8. Rollback protection ---------------------------------------------------
# Network and firewall changes can cut off SSH. For those, the timer restores
# the old config unless the operator confirms reachability (step 10).

- name: Decide whether network rollback protection is needed
  ansible.builtin.set_fact:
    openwrt_rollback_needed: "{{ openwrt_rollback_enabled and (openwrt_uci_changed_packages | intersect(openwrt_rollback_packages) | length > 0) }}"

- name: Snapshot protected configuration and arm rollback timer
  when: openwrt_rollback_needed
  block:
    - name: Prepare the on-device recovery snapshot and timer
      ansible.builtin.include_tasks: rollback_prepare.yml
  rescue:
    # Nothing has been committed yet, so reverting is enough to leave the router unchanged.
    - name: Revert staged changes if rollback preparation fails
      ansible.builtin.raw: "uci revert {{ item | quote }}"
      loop: "{{ openwrt_uci_changed_packages }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false

    - name: Remove incomplete rollback snapshot state
      ansible.builtin.raw: "rm -rf {{ openwrt_rollback_run_dir | quote }}"
      when: openwrt_rollback_run_dir is defined
      changed_when: false

    - name: Stop before committing without rollback protection
      ansible.builtin.fail:
        msg: "Rollback preparation failed; staged UCI changes were reverted and nothing was committed."

# ---- 9. Commit and apply -----------------------------------------------------

# The marker lists each package committed in this run. The reload handler
# reads it and reloads only those services.
- name: Clear the changed-package marker before commits
  ansible.builtin.raw: ": > {{ openwrt_uci_change_marker | quote }}"
  changed_when: false

# `uci commit` writes the staged delta into /etc/config. The package is then
# added to the marker, and the handler reloads its service.
- name: Commit approved packages
  ansible.builtin.raw: >-
    uci commit {{ item | quote }} &&
    { grep -qx {{ item | quote }} {{ openwrt_uci_change_marker | quote }} 2>/dev/null ||
      printf '%s\n' {{ item | quote }} >> {{ openwrt_uci_change_marker | quote }}; } &&
    echo CHANGED
  loop: "{{ openwrt_uci_changed_packages }}"
  loop_control:
    label: "{{ item }}"
  register: openwrt_uci_commit
  changed_when: "'CHANGED' in openwrt_uci_commit.stdout"
  notify: Apply changed UCI packages

# Runs the reload handlers now, so services use the new config before the
# operator is asked to confirm.
- name: Apply committed configuration
  ansible.builtin.meta: flush_handlers

# ---- 10. Confirm or roll back -------------------------------------------------

# The operator checks that the router is still reachable. Only 'yes' cancels
# the rollback timer.
- name: Ask for post-apply confirmation while rollback is armed
  ansible.builtin.pause:
    prompt: >-
      Confirm you can still reach the router and that network/firewall behavior is correct.
      Type 'yes' to cancel rollback
  register: openwrt_rollback_approval
  when:
    - openwrt_rollback_needed
    - openwrt_manual_confirmation

- name: Require post-apply confirmation before cancelling rollback
  ansible.builtin.assert:
    that:
      - openwrt_rollback_approval.user_input | default('yes') | lower == 'yes'
    fail_msg: "Rollback was not confirmed; the on-device timer will restore the saved configuration."
    quiet: true
  when:
    - openwrt_rollback_needed
    - openwrt_manual_confirmation

- name: Confirm configuration and cancel rollback timer
  ansible.builtin.include_tasks: rollback_confirm.yml
  when: openwrt_rollback_needed

# ---- 11. Record ownership -----------------------------------------------------
# The manifest is written to a temporary file in batches, then moved into place
# in one step. Each SSH command is kept short because dropbear rejects long ones
# ("String too long"). The old manifest stays in place until the new one is complete.

- name: Start an empty managed-section manifest
  ansible.builtin.raw: "umask 077; : > {{ (openwrt_uci_manifest_path ~ '.tmp') | quote }}"
  changed_when: false

- name: Append managed-section manifest records
  ansible.builtin.raw: >-
    umask 077;
    printf '%s\n' {{ item | map('quote') | join(' ') }} >> {{ (openwrt_uci_manifest_path ~ '.tmp') | quote }}
  loop: "{{ (openwrt_uci_desired_section_records + openwrt_uci_desired_option_records) | batch(50) | list }}"
  loop_control:
    label: "manifest batch"
  changed_when: false

- name: Replace the managed-section manifest atomically
  ansible.builtin.raw: "mv -f {{ (openwrt_uci_manifest_path ~ '.tmp') | quote }} {{ openwrt_uci_manifest_path | quote }}"
  changed_when: false

# The marker only exists to coordinate the handlers, so it is removed at the end.
- name: Remove the changed-package marker
  ansible.builtin.raw: "rm -f {{ openwrt_uci_change_marker | quote }}"
  changed_when: false

# ---- 12. Mail and nightly safe upgrades (optional, outside UCI) --------------
# Mail is set up when the nightly job or the change report is on. The nightly
# job's script and cron entry come after it. See mail.yml and auto_update.yml.

- name: Configure mail on the router
  ansible.builtin.include_tasks: mail.yml
  when: openwrt_auto_update_enabled or openwrt_report_enabled

- name: Configure the nightly safe package upgrades
  ansible.builtin.include_tasks: auto_update.yml
  when: openwrt_auto_update_enabled
