---
# Entry point of the openwrt role. The phases are in phases.yml. They run inside
# a block, so the Loki log push started by site.yml is stopped and its token is
# removed when the phases finish, even if one of them fails.

- name: Run the role phases
  block:
    - name: Apply the role phases
      ansible.builtin.include_tasks: phases.yml
  always:
    - name: Stop the Loki log push and remove its token
      ansible.builtin.include_tasks: loki_stop.yml
